services:
  java-example:
    build: .
    image: ai-hub-java-example:1.0.0
    restart: unless-stopped
    environment:
      JAVA_EXAMPLE_HOST_SECRET: ${JAVA_EXAMPLE_HOST_SECRET:?Set a shared secret of at least 32 characters}
      JAVA_EXAMPLE_HOST_BASE_URL: ${JAVA_EXAMPLE_HOST_BASE_URL:-}
      JAVA_EXAMPLE_DATA_DIR: /app/data
      JAVA_EXAMPLE_SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${JAVA_EXAMPLE_PUBLISHED_PORT:-3013}:8080"
    volumes:
      - java-example-data:/app/data

volumes:
  java-example-data:
