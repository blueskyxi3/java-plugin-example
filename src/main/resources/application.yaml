server:
  port: ${JAVA_EXAMPLE_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: java-example
  mvc:
    static-path-pattern: /assets/**
  web:
    resources:
      static-locations: classpath:/assets/
plugin:
  id: ${JAVA_EXAMPLE_PLUGIN_ID:java-example}
  host-secret: ${JAVA_EXAMPLE_HOST_SECRET:}
  host-base-url: ${JAVA_EXAMPLE_HOST_BASE_URL:}
  data-directory: ${JAVA_EXAMPLE_DATA_DIR:./data}
